<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clankerbot Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Babel for in-browser transpilation of React/TypeScript -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.27.0",
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
      }
    }
    </script>
    <script>
      // Polyfill process.env for browser environments to prevent crashes
      window.process = {
        env: {
          API_KEY: '' // This will be populated if you use a bundler, but prevents crash on static hosts
        }
      };
      
      // Error trap to show something on the screen if React fails to mount
      window.addEventListener('error', function(e) {
        if (document.body && !document.getElementById('root').hasChildNodes()) {
            const errorDiv = document.createElement('div');
            errorDiv.style.color = '#fff';
            errorDiv.style.padding = '20px';
            errorDiv.style.background = 'rgba(255,0,0,0.5)';
            errorDiv.style.position = 'fixed';
            errorDiv.style.top = '0';
            errorDiv.style.left = '0';
            errorDiv.style.width = '100%';
            errorDiv.style.zIndex = '9999';
            errorDiv.innerText = 'Application Error: ' + e.message;
            document.body.appendChild(errorDiv);
        }
      });
    </script>
    <style>
      body {
        background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
        color: #e2e8f0;
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
      }
      
      /* Glassmorphism utilities */
      .glass-panel {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(148, 163, 184, 0.1);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      
      .input-modern {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(59, 130, 246, 0.3);
        color: white;
        transition: all 0.2s;
      }
      
      .input-modern:focus {
        border-color: #3b82f6;
        outline: none;
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(15, 23, 42, 0.5); 
      }
      ::-webkit-scrollbar-thumb {
        background: #3b82f6; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #60a5fa; 
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Main Application Script -->
    <script type="text/babel" data-type="module" data-presets="react,typescript">
        import './index.tsx';
    </script>
  </body>
</html>
